version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facttrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facttrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facttrack_secret}
      POSTGRES_DB: ${POSTGRES_DB:-facttrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - facttrack_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facttrack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: facttrack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - facttrack_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facttrack_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facttrack}:${POSTGRES_PASSWORD:-facttrack_secret}@postgres:5432/${POSTGRES_DB:-facttrack}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - cas_data:/data/cas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facttrack_net
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facttrack_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facttrack}:${POSTGRES_PASSWORD:-facttrack_secret}@postgres:5432/${POSTGRES_DB:-facttrack}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - cas_data:/data/cas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facttrack_net
    command: python -m arq app.workers.parse_worker.WorkerSettings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facttrack_frontend
    restart: unless-stopped
    networks:
      - facttrack_net

  nginx:
    image: nginx:1.27-alpine
    container_name: facttrack_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - facttrack_net

volumes:
  postgres_data:
  redis_data:
  cas_data:

networks:
  facttrack_net:
    driver: bridge
